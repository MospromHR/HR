services:
  postgres:
    image: postgres:16.1-alpine3.19
    environment:
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}
    expose:
      - 5432

  backend:
    build:
      context: backend
    expose:
      - 8000
    environment:
      - APP_POSTGRES_HOST=${POSTGRES_HOST}
      - APP_POSTGRES_PORT=${POSTGRES_PORT}
      - APP_POSTGRES_USERNAME=${POSTGRES_USERNAME}
      - APP_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - APP_POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - APP_ROOT_PATH=/api
      - APP_STORAGE_MEDIA_ROOT=/var/lib/hr/backend-media
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 3
    volumes:
      - backend-media-storage:/var/lib/hr/backend-media

  nginx:
    image: nginx:1.25-alpine
    depends_on:
      - backend
    ports:
      - "8180:80"
    volumes:
      - ./frontend/dist/hakaton/browser:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - backend-media-storage:/var/lib/hr/backend-media:ro

volumes:
  backend-media-storage:
