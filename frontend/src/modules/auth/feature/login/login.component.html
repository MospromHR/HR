<div class="container">
  <h1 class="heading">Вход</h1>
  <div class="form" [formGroup]="authForm">
    <tui-input formControlName="login" class="input">
      Логин
    </tui-input>
    <tui-input-password formControlName="password" class="input">
      Пароль
    </tui-input-password>
  </div>
  <div class="button-wrapper">
    <button class="button login" (click)="goToLogin()" [disabled]="authForm.invalid">Вход</button>
    <button class="button register" (click)="goToRegister()">Зарегистрироваться</button>
  </div>
</div>
