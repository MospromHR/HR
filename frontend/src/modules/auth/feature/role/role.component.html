@let selectedRoleValue = selectedRole();
<div class="container">
  <div class="logo"></div>
  <h1 class="heading">Вход</h1>
  <div class="wrapper">
    <auth-role-item title="Я ищу работу/стажировку"
                    subtitle="Профиль соискателя"
                    [isSelected]="selectedRoleValue === 'applicant'"
                    (click)="selectRole('applicant')"></auth-role-item>
    <auth-role-item title="Я ищу стажировки"
                    subtitle="Профиль вуза"
                    [isSelected]="selectedRoleValue === 'education'"
                    (click)="selectRole('education')"></auth-role-item>
    <auth-role-item title="Я ищу сотрудников"
                    subtitle="Профиль работодателяя"
                    [isSelected]="selectedRoleValue === 'company'"
                    (click)="selectRole('company')"></auth-role-item>
  </div>
  <div class="button-wrapper">
    <button class="button login" (click)="goToLogin()">Вход</button>
    <button class="button register" (click)="goToRegister()">Зарегистрироваться</button>
  </div>
</div>
